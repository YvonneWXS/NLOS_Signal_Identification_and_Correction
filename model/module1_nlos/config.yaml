# module1_nlos/config.yaml — Module 1: NLOS Perception & Error Modeling

dataset:
  name: berlin1_potsdamer_platz
  validation_split: 0.2

model:
  architecture: gat
  in_features: 11
  hidden_features: 128
  num_heads: 8
  num_layers: 2
  dropout: 0.1
  use_mixture_gaussian: true

training:
  num_epochs: 100
  batch_size: 32
  learning_rate: 5.0e-5
  gradient_clip: 1.0
  gradient_accumulation: 1
  use_block_diagonal: true
  num_workers: 8
  val_num_workers: 4
  use_amp: true
  random_seed: 42

  lr_scheduler:
    enabled: true
    patience: 10
    factor: 0.5
    min_lr: 1.0e-6

  early_stopping:
    patience: 200

loss:
  pos_weight: 1.07
  label_smoothing: 0.05
  lambda_bce: 0.6
  p_los_smoothing: 0.2
  lambda_entropy: 0.03
  lambda_unc: 0.08
  lambda_elevation_prior: 0.1

  # MoG specific
  mog_pure_bce_epochs: 8
  mog_blend_epochs: 25
  mu_nlos_min: 0.0
  mu_nlos_max: 3.0
  sigma_nlos_min: 0.05
  sigma_nlos_max: 12.0
  sigma_los_clamp_log_min: -3.0
  sigma_los_clamp_log_max: 2.0
  sigma_nlos_clamp_log_min: -3.0
  sigma_nlos_clamp_log_max: 2.5
  sigma_head_grad_clip: 0.5
  lambda_mu_reg: 0.20
  lambda_mu_warmup_reg: 0.05
  lambda_mu_direction: 1.0
  mu_direction_los_target: 0.05
  mu_direction_margin: 0.10
  mu_nlos_target: 0.30
  lambda_bce_in_nll: 1.5
  lambda_bce_final: 0.6
  p_los_lr_multiplier: 6
  auto_pos_weight: true
  lambda_sigma_reg: 0.01
  sigma_gap_target: 0.5
  lambda_sigma_sep: 5.0

graph:
  azimuth_threshold: 90

logging:
  log_interval: 5
  use_tensorboard: true
  log_histogram_epochs: 5

device: auto

paths:
  data_root: "D:/3_document/4_research/NLOS Signal Identification and Correction/data/dataset"
  processed_data_dir: "D:/3_document/4_research/NLOS Signal Identification and Correction/data/processedData"
  result_dir: "D:/3_document/4_research/NLOS Signal Identification and Correction/model/module1_nlos/result"
